name: materialize

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: ${{ contains(github.event.head_commit.message, 'source complete') && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack generator
        run: |
          set -euo pipefail
          cat source/part00 source/part01 source/part02 source/part03 > source.b64
          echo "43e1784532b3752f4f029deaa09b64ef3f558dd4546e650a78f3fd003b7d7bcf  source.b64" | sha256sum -c -
          base64 -d source.b64 | tar -xz
          rm -rf source source.b64
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          touch .nojekyll
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Build pack
        run: python3 tools/build_pack.py
      - name: Publish the pack
        run: |
          set -euo pipefail
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Materialize Psychill [skip ci]"
            git push origin HEAD:main
          fi
          git push origin HEAD:gh-pages
